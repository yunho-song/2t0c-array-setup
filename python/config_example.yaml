# ─────────────────────────────────────────────────────────────────────
#  2T0C FeFET array measurement config  (fearray_measure.py)
# ─────────────────────────────────────────────────────────────────────
output_dir: data

arduino:
  port: COM5            # Arduino Due programming port
  timeout: 1.0

# ── Power supplies: 2 x Keysight EDU36311A (6 rails). Board supply is separate. ──
psu:
  resources:                     # NI MAX alias or full VISA string (pyvisa list_resources_info)
    1: "POWER_SUPPLY_1"          # CN65070038
    2: "POWER_SUPPLY_2"          # CN65060143
    3: "POWER_SUPPLY_3"          # CN65080108
  rails:                         # bench wiring 2026-10-26. negative:true = channel "+" wired to GND
    WBL_OFF:  {psu: 1, ch: 1, negative: true,  current_limit: 0.05}   # N2 off : rest 0 V / erase -V
    VREAD:    {psu: 1, ch: 3, negative: true,  current_limit: 0.05}   # RWL read bias, below VINP
    WBL_PROG: {psu: 2, ch: 1, negative: false, current_limit: 0.05}   # N2 on  : program +V (6 V max)
    WWL_OFF:  {psu: 2, ch: 3, negative: true,  current_limit: 0.05}   # N1 off
    VDD:      {psu: 3, ch: 1, negative: false, current_limit: 0.50}   # board +supply
    VSS:      {psu: 3, ch: 2, negative: true,  current_limit: 0.50}   # board -supply
    WWL_ON:   {psu: 3, ch: 3, negative: false, current_limit: 0.05}   # N1 on
    # (4T0C only, dep_path=1)  WBL_DEP: {psu: 2, ch: 2, negative: true}   BLBTM_OFF: {psu: 1, ch: 2, negative: false}
  on_order:  [VDD, VSS, WWL_OFF, WBL_OFF, VREAD, WWL_ON, WBL_PROG]
  off_order: [WBL_PROG, WWL_ON, VREAD, WBL_OFF, WWL_OFF, VSS, VDD]
  ramp_steps: 3
  settle_after_apply_s: 1.0
  ramp_down_at_end: true

# ── Base rail voltages [V] (overridable per experiment) ──
voltages:
  VDD: 5.0
  VSS: -5.0          # board negative supply (confirm the value used so far on PSU3 CH2)
  WWL_ON: 3.0          # WTR gate ON  (N1 pin HIGH)
  WWL_OFF: -2.0        # WTR gate OFF (N1 pin LOW)
  WBL_PROG: 4.0        # program level on WBL (N2 pin HIGH)
  WBL_OFF: 0.0         # rest level on WBL (N2 LOW); the erase level in D phase -> set per phase (phase_voltages)
  VREAD: -1.0        # RWL read bias; must be BELOW the integrator virtual-ground (VINP) -> negative (rail wired inverted)

# ── Default scenario parameters (firmware fields) ──
defaults:
  set_num: 1
  pot_num: 20          # program pulses per set
  dep_num: 20          # erase pulses per set
  pot_pw: 5000         # [us]
  dep_pw: 5000         # [us]
  pre_en: 20           # [us]
  post_en: 20          # [us]
  zero_t: 20           # [us]
  read_time: 1000      # RWL pulses x 100 us  (-> I = C*V/t uses this)
  read_set_time: 20    # [us] gate settle after WWL ON (N1ALL / N1SEL read)
  read_delay: 20       # x 10 us
  read_interval: 1     # read (all 25 cells) every N pulses
  read_mode: N1OFF     # N1OFF: WTR off during read (gate floating)
                       # N1ALL: all 5 WWL on during read (gate = WBL_OFF)
                       # N1SEL: only selected-column WWL on during read
  avg_count: 10        # ADC samples averaged per cell read
  wwl_hold: 0          # 1 = keep selected WWL ON through the whole program phase (old FE mode)
  read_wait_ms: 100    # delay before each map read
  phase_gap_ms: 0      # PD/DP (firmware-only mode): wait between P phase and D phase [ms]
  dep_path: 0          # 0 = TOP    (2T0C: WWL pulse, WBL sits at WBL_OFF DC for the whole D phase; use phase_voltages)
                       # 2 = TOPINV (2T0C: WBL rests at 0 V = D-phase WBL_PROG rail, pulsed to WBL_OFF only while WWL is open.
                       #             Needs phase_voltages D: {WBL_PROG: 0.0, WBL_OFF: -3.0}. Less stress / disturb than TOP)
                       # 1 = BOT    (4T0C bottom path only)

# ── Experiments (run in order). Any defaults/voltages key can be overridden. ──
experiments:
  - name: init_map            # baseline map of all 25 cells, no pulses
    scenario: INIT
    rows: []
    cols: []

  - name: cell00_PD           # single cell (0,0): identical-pulse P then D, 3 sets
    scenario: PD
    rows: [0]
    cols: [0]
    set_num: 3

  - name: cell00_PD_splitV      # P와 D에 서로 다른 PSU 전압: Python이 phase 사이에 rail을 바꿈
    scenario: PD
    rows: [0]
    cols: [0]
    set_num: 2
    phase_voltages:             # 없는 키는 voltages: 기본값 사용
      P: {WBL_PROG: 4.0, WBL_OFF: 0.0, WWL_ON: 3.0}
      D: {WBL_OFF: -3.0, WWL_ON: 4.0}
    phase_gap_s: 1.0            # phase 전환 후 추가 대기 (PSU settle 이후)

  - name: cell00_PD_pulsedWBL   # TOPINV: WBL은 0 V에서 쉬고 WWL이 열린 동안만 -3 V 펄스 (WTR 게이트 스트레스 = P 펄스 수준)
    scenario: PD
    rows: [0]
    cols: [0]
    set_num: 2
    dep_path: 2
    phase_voltages:
      P: {WBL_PROG: 4.0, WBL_OFF: 0.0, WWL_ON: 3.0, WWL_OFF: -2.0}
      D: {WBL_PROG: 0.0, WBL_OFF: -3.0, WWL_ON: 0.0, WWL_OFF: -4.0}   # WWL_ON 0 V면 충분 (Vgs = 0-(-3) = 3 V), WWL_OFF <= WBL_OFF-1

  - name: cell22_PD_nohold
    scenario: PD
    rows: [2]
    cols: [2]
    set_num: 2

  - name: row1_PD             # whole row 1 (5 cells) at once
    scenario: PD
    rows: [1]
    cols: [0, 1, 2, 3, 4]

  - name: diag_P              # diagonal cells, program only
    scenario: P
    rows: [0, 1, 2, 3, 4]     # NOTE: row/col masks select the CROSS product -> use one row or
    cols: [0]                 #       one col per experiment for a true diagonal

  - name: cell00_P_vprog      # ISPP-like: sweep WBL_PROG rail, program only
    scenario: P
    rows: [0]
    cols: [0]
    pot_num: 10
    sweep: {key: WBL_PROG, values: [3.0, 3.5, 4.0, 4.5]}

  - name: retention_map       # read the map 10 times, 60 s apart
    scenario: R
    r_points: 10
    r_interval_s: 60
